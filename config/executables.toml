# Known GH executables and discs, identified by SHA-1.
#
# executable.sha1 is the boot ELF, which is what the recompile depends on.
# disc.data_sha1 hashes the data track's 2048-byte sectors
# (`tools/disc.py identify --image-hash`), which is exactly Redump's SHA-1.
# The three retail discs match Redump's published values.

[[disc]]
name = "Guitar Hero (USA)"
data_sha1 = "4caacaea582c79605f8c3582dd4b90abdec699f5"
redump = "http://redump.org/disc/699/"

[[disc]]
name = "Guitar Hero II (USA)"
data_sha1 = "e1a3a81827aa4264984b4f3678de58ca3d881528"
redump = "http://redump.org/disc/627/"

[[disc]]
name = "Guitar Hero Encore - Rocks the 80s (USA)"
data_sha1 = "184f2dc9993d9b1e6edf0125f68e1ce07742567a"
redump = "http://forum.redump.org/post/131232/"

[[disc]]
name = "Guitar Hero II Deluxe 2.0"
data_sha1 = "8ef0d0a6e90d46c64a553590ffc27c6e2a2bc447"

# Every Milo-engine release Redump lists (GH1, GH2, 80s; GH3 onward is a
# different engine). Recognised by the serial in the boot executable's name,
# so a disc we cannot use still gets named. Each is a separate compile with
# its own addresses. role: "engine" is recompiled (required), "content" adds
# its songs and venues; a release with no role is not supported.

[[release]]
serial = "SLUS-21224"
name = "Guitar Hero (USA)"
version = "1.00"
role = "content"

[[release]]
serial = "SLES-54093"
name = "Guitar Hero (Europe)"
version = "1.00"

[[release]]
