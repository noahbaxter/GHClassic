# Every Milo-engine release Redump lists (GH1, GH2, 80s; GH3 onward is a
# different engine), and 360 GH2. Recognised by the serial in the boot
# executable's name (a 360's title ID), so a disc we cannot use still gets
# named. game: the name src/content/games.h and ghc.py --discs give it.
# role: "engine" is recompiled (required), "content" adds its songs and
# outfits when mounted, any of a game's content releases doing; a release
# with no role is not supported (not yet checked to work).

[[release]]
serial = "SLUS-21224"
game = "gh1"
name = "Guitar Hero (USA)"
version = "1.00"
role = "content"

[[release]]
