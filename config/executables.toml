# Known GH executables and discs, identified by SHA-1.
#
# executable.sha1 is the boot ELF, which is what the recompile depends on.
# disc.data_sha1 hashes the data track's 2048-byte sectors
# (`tools/disc.py identify --image-hash`), which is exactly Redump's SHA-1.
# The three retail discs match Redump's published values.

[[disc]]
name = "Guitar Hero (USA)"
data_sha1 = "4caacaea582c79605f8c3582dd4b90abdec699f5"
redump = "http://redump.org/disc/699/"

[[disc]]
name = "Guitar Hero II (USA)"
