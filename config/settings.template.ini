# GH Classic settings. Delete a line to restore its default.

[display]
widescreen         = true
frame_rate_cap     = 0         # 0 matches the display's refresh rate
msaa               = 4         # anti-aliasing samples per pixel, 1 is off
mipmaps            = true      # smooths distant textures
depth_of_field     = true
frustum_cull       = false     # skips off-screen drawing, might drop bits of a scene unintentionally
gh1_band_shadows   = gh2       # band shadows in GH1 venues: gh2 | classic (GH1's own) | off

[latency]
video_ms           = 45        # ms the picture is late
audio_ms           = 45        # ms the sound is late

[audio]
band_volume        = 11        # 0 to 11
guitar_volume      = 11
fx_volume          = 11
stereo             = true

[controls]
lefty              = false
lefty_p2           = false

[gameplay]
track_on_at_start  = true      # guitar track sounds before hitting the first note
sustain_release_ms = 100       # guitar track continues playing if sustain is released within this many ms of its end
whammy_hold        = true      # holding down the whammy bends later sustains too, like GH3 onward
note_speed_easy    = 43
note_speed_hard    = 60
highway_length     = 110

# Which game's assets should quickplay use? Careers always show the original game's.
[game_style]
in_song_ui         = venue     # loading, pause, results and HUD: venue | gh1 | gh2 | gh80s
gems               = auto      # auto follows in_song_ui: auto | gh1 | gh2
band               = venue     # the backing band: venue | gh1 | gh2 | gh2x (the 360's)
menu_music         = theme     # theme | gh1 | gh2 | gh80s | all
menu_music_order   = playlist  # playlist | loop | shuffle
highway            = auto      # the 360's track and fretboards, auto with its venues: auto | classic | hd

[quickplay]
song_defaults      = false     # false lets you pick the guitarist, guitar and venue; true plays the song's own
# With the 360 disc, its models or the PS2's. The pickers set these: blue on a guitarist, a guitar or GH2's venue map.
characters         = hd        # guitarists and band: sd | hd
guitars            = hd        # sd | hd
venues             = hd        # GH2's venues, their crowd and lighting: sd | hd

[system]
fast_boot          = true      # skip logos and the intro movie
check_updates      = true
export_card        = false     # also save to GHClassic.ps2 for PCSX2 import
prefer             = chd       # chd | iso, which disc image to read if both exist
