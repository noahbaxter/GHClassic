# GH Classic settings. Delete a line to restore its default.

[display]
widescreen         = true
frame_rate_cap     = 60        # 0 disables the cap
vsync              = true      # locks your framerate to your monitor's refresh rate
msaa               = 4         # anti-aliasing samples per pixel [1, 2, 4, 8, 16], 1 is off
render_scale       = 100       # percent of the window's size the picture is drawn at [50, 75, 100, 125, 150, 175, 200]
temporal_aa        = false     # steadies shimmer over frames, with the 360's lighting
high_detail        = true      # far characters keep their close-up models
lighting           = next_gen  # with the 360's venues, guitarists and guitars: last_gen (the PS2's) | next_gen (the 360's)
perf_overlay       = off       # frame times in the top left corner: off | fps | graph | full
mipmaps            = true      # smooths distant textures
vector_fonts       = true      # sharp text at any resolution, in the fonts traced so far
depth_of_field     = true
frustum_cull       = false     # skips off-screen drawing, might drop bits of a scene unintentionally
gh1_band_shadows   = gh2       # band shadows in GH1 venues: gh2 | classic (GH1's own) | off

[latency]
video_ms           = 0         # ms the picture is late
audio_ms           = 0         # ms the sound is late

[audio]
band_volume        = 11        # 0 to 11
guitar_volume      = 11
fx_volume          = 11
stereo             = true
maintain_pitch     = true      # a song slowed or sped up keeps its pitch; off, it plays faster or slower like a tape

[practice]
practice_metronome  = false    # a click on every beat, another on each bar's first
practice_note_click = false    # a click as each note reaches the strikeline
practice_solo_stems = true    # the played part alone with drum clicks where it has its own audio; off, the whole song

[controls]
lefty              = false
lefty_p2           = false
true_lefty_flip    = true      # a lefty player's guitarist plays left-handed too

[gameplay]
track_on_at_start  = true      # guitar track sounds before hitting the first note
sustain_release_ms = 100       # guitar track continues playing if sustain is released within this many ms of its end
miss_mute          = true      # guitar track cuts out on a missed note or a sustain let go early
whammy_hold        = true      # holding down the whammy bends later sustains too, like GH3 onward
strum_limit        = false     # the PS2's limit of 15 strums a second (more above 60 fps; frame_rate_cap = 60 for the PS2's own, 50 for PAL's 16.7)
star_power_overlap = true      # a star power phrase hit during star power adds to it and keeps it going, like Clone Hero
note_streak        = true      # note streak counter under the score and popups at milestones from 50
song_progress      = true      # bar under the rock meter filling as the song plays
tap_rope           = rails     # what joins a run of tap notes on the highway: off | line | rails
unlock_all         = false     # every song, venue, guitarist and guitar open in quickplay; careers stay as earned
note_speed_easy    = 43
note_speed_hard    = 60
highway_length     = 110

# Which game's assets should quickplay use? Careers always show the original game's.
[game_style]
in_song_ui         = venue     # loading, pause, results, gems and HUD: venue | gh1 | gh2 | gh80s
band               = venue     # the backing band: venue | gh1 | gh2 | gh2x (the 360's)
menu_music         = theme     # theme | gh1 | gh2 | gh80s | all
menu_music_order   = playlist  # playlist | loop | shuffle
highway            = auto      # the 360's track and fretboards, auto with its venues: auto | classic | hd

[quickplay]
song_defaults      = false     # false lets you pick the guitarist, guitar and venue; true plays the song's own
# With the 360 disc, its models or the PS2's. The pickers set these: blue on a guitarist, a guitar or GH2's venue map.
characters         = hd        # guitarists and band: sd | hd
guitars            = hd        # sd | hd
venues             = hd        # GH2's venues, their crowd and lighting: sd | hd

[songs]
# Your chart folders (Clone Hero's, say), ';' between them. Only read, never written to.
folders            =
show_duplicates    = false     # false lists one of each chart found more than once; badsongs.txt names the rest

[system]
fast_boot          = true      # skip logos and the intro movie
check_updates      = true
export_card        = false     # also save to GHClassic.ps2 for PCSX2 import
prefer             = chd       # chd | iso, which disc image to read if both exist

[dev]
frame_log          = false     # writes frametimes.csv beside this file, a row a frame
