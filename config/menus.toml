# The menus' rules, each a list kept here once: the sound each press makes.
# Screens never restate them. tools/menus.py checks this file and writes it
# out for the game's scripts when the build configures (src/ui/dta/shared/
# reads it).

# Menu sounds, keyed on the press: green selects, red backs out, a strum
# toggles, and a focus or scroll sounds only after a strum. The rest is the
# game's own (ui/sfx.dta on the disc), kept.
[sounds]
select = "button_select"
back = "button_back.cue"
toggle = "button_toggle"
start = "button_play"
# The presses that are a strum.
strum = ["kPad_DUp", "kPad_DDown", "kPad_DLeft", "kPad_DRight"]
# Green starts a song on these screens, and from these buttons, so sounds start.
start_screens = ["sel_song_screen", "multi_seldiff_screen", "seldiff_screen"]
start_buttons = ["pause_restart.btn", "pause_controller_resume.btn", "lose_restart.btn", "comp_restart.btn"]
# Lists that scroll without a sound.
quiet_scroll = ["credits_panel", "sel_character_panel"]
