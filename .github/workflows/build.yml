# Everything that builds without a disc (tools/ghc.py ci), on each platform:
# the recompiler tools, the runtime and every library the game links. The
# game itself needs a disc's generated code. Nothing is uploaded.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python tools/ghc.py ci

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python tools/ghc.py ci

  # The release baseline: Ubuntu 22.04, glibc 2.35, clang 21 over GCC 12's
  # libstdc++.
  linux:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    env:
      CC: clang-21
      CXX: clang++-21
      LDFLAGS: -fuse-ld=lld-21
      DEBIAN_FRONTEND: noninteractive
    steps:
      # Before checkout, which needs git for the submodules.
      - run: apt-get update && apt-get install -y git
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # The container runs as root over a checkout owned by the runner.
      - run: git config --global --add safe.directory '*'
      - run: .github/linux-deps.sh
      - run: python3.11 tools/ghc.py ci
